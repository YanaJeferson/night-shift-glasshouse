<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090e10">
    <meta name="description" content="A tense, playable museum heist. Slip past the guards, lift the artifact, and get out clean.">
    <title>Night Shift — The Glasshouse Job</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="game-shell" aria-label="Night Shift heist game">
      <canvas id="game" width="1280" height="720" aria-label="Top-down museum stealth game"></canvas>
      <section class="sr-only" aria-label="How to play">
        <h1>Night Shift: The Glasshouse Job</h1>
        <p>Move with WASD or the arrow keys. Hold Shift to sneak. Press E near the artifact to steal it. Click the floor to toss a distraction. Reach the green extraction door after taking the artifact. Avoid guard vision cones and camera beams. Press R to restart.</p>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
